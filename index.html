<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Что почитать</title>
<meta name="description" content="Книги и аудиокниги, от которых не оторваться">
<meta name="theme-color" content="#0f0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Почитать">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/unbounded-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Шрифты лежат в приложении (папка fonts), без обращения к Google */
@font-face{font-family:Manrope;font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/manrope-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/manrope-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Unbounded;font-style:normal;font-display:swap;font-weight:200 900;src:url(fonts/unbounded-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Unbounded;font-style:normal;font-display:swap;font-weight:200 900;src:url(fonts/unbounded-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#0f0d12;--panel:#1a1720;--panel2:#231f2b;--line:#332d3d;
  --text:#f3eee6;--muted:#a59fae;--accent:#5ee0b0;--accent2:#38b6d6;
  --good:#5ee0b0;--bad:#ff7a7a;--later:#7fd9ff;
  --on-accent:#03251a;--why-text:#d4efe4;--why-bg:#12261f;--sel-bg:#123327;--glow:#12382f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(40px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 50% -10%,var(--glow) 0%,transparent 60%),var(--bg);background-repeat:no-repeat}
button{-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px 22px}
h1{font-family:Unbounded,sans-serif;font-size:26px;letter-spacing:-.5px;line-height:1.1}
h1 span{color:var(--accent)}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin:20px 0 18px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font:600 15px Manrope,system-ui,sans-serif;padding:10px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--panel2);color:var(--text)}
.tab .cnt{font-size:12px;color:var(--accent);margin-left:4px}
.label{font:600 12px Manrope,system-ui,sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 0 8px}
.label i{font-style:normal;text-transform:none;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);font:500 14px Manrope,system-ui,sans-serif;padding:9px 13px;border-radius:999px;cursor:pointer;transition:.15s}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);font:16px Manrope,system-ui,sans-serif;padding:12px 14px;border-radius:12px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{border:0;cursor:pointer;font:700 16px Manrope,system-ui,sans-serif;padding:15px 18px;border-radius:14px;color:var(--text)}
.btn.main{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.status{color:var(--muted);font-size:14px;text-align:center;margin:22px 0}
.dots::after{content:'';animation:d 1.2s infinite}
@keyframes d{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;transition:.3s}
.card.done{opacity:.45}
.kind{display:inline-block;font:700 11px Manrope,system-ui,sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:6px}
.card h3{font-family:Unbounded,sans-serif;font-size:19px;line-height:1.2;font-weight:500}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.hook{margin-top:10px;font-size:15px}
.why{margin-top:10px;font-size:14px;color:var(--why-text);background:var(--why-bg);border-left:3px solid var(--accent);padding:9px 12px;border-radius:0 10px 10px 0}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.act{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:9px 2px;font:600 12px Manrope,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.act.sel{border-color:var(--accent);background:var(--sel-bg)}
.acts .act{font-size:11.5px;padding:9px 0}
.bar{height:6px;background:var(--panel2);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .3s}
.meta.audio{display:flex;align-items:center;gap:6px;color:var(--why-text)}
.meta.audio .ic{width:15px;height:15px;color:var(--accent)}
.act .ic{width:20px;height:20px}
.act.sel .ic{color:var(--accent)}
.find{display:inline-flex;align-items:center;gap:6px;margin-top:12px;color:var(--later);font-size:14px;text-decoration:none}
.find .ic{width:15px;height:15px}
.links{display:flex;gap:16px;flex-wrap:wrap}
.links.sm{gap:18px}
.links.sm .find{margin-top:6px;font-size:13px}
.sec{margin-top:22px}
.sec h2{font:700 15px Manrope,system-ui,sans-serif;display:flex;align-items:center;gap:8px}
.sec h2 small{color:var(--muted);font-weight:500}
.sec h2 .ic{width:19px;height:19px;color:var(--accent)}
.row{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:600}
.row .t div{color:var(--muted);font-size:13px;margin-top:2px}
.row .yr{color:var(--muted)}
.row.watch,.row.stack{flex-direction:column;align-items:stretch}
.row.stack{gap:0}
.row.watch .top,.row.stack .top{display:flex;gap:10px;align-items:flex-start}
.mini{display:flex;gap:4px;flex-shrink:0}
.mini button{border:1px solid var(--line);background:var(--panel2);color:var(--text);width:34px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mini button .ic{width:16px;height:16px}
.empty{color:var(--muted);font-size:14px;margin-top:8px}
.add{display:grid;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:#fff;color:#111;font:600 14px Manrope,system-ui,sans-serif;padding:11px 18px;border-radius:999px;transition:.25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.hidden{display:none!important}
.quick{display:flex;gap:8px}
#surprise .ic{width:22px;height:22px}
#surprise{display:flex;align-items:center;justify-content:center}
.newshead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.newshead h2{font:700 17px Manrope,system-ui,sans-serif;display:flex;align-items:center;gap:8px}
.newshead h2 .ic{width:19px;height:19px;color:var(--accent)}
.newshead small{color:var(--muted);font-size:12px}
.newswrap{margin-bottom:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.prog .pv{font:700 14px Manrope,system-ui,sans-serif;color:var(--accent);min-width:92px}
.prog button{border:1px solid var(--line);background:var(--panel2);color:var(--text);height:32px;padding:0 10px;border-radius:9px;cursor:pointer;font:600 13px Manrope,system-ui,sans-serif;display:inline-flex;align-items:center;gap:5px}
.prog button.fin{border-color:var(--good);color:var(--good)}
.prog .ic{width:15px;height:15px}
details.fold summary{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary h2{margin:0}
details.fold .arr{margin-left:auto;color:var(--muted);transition:transform .2s;display:flex}
details.fold .arr .ic{width:18px;height:18px}
details.fold[open] .arr{transform:rotate(180deg)}
details.fold[open] summary{margin-bottom:2px}
details.fold.sec{margin-top:10px}
.ic{width:18px;height:18px;flex-shrink:0;vertical-align:-3px}
.foot{margin-top:34px;text-align:center;font-size:13px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--later);font:inherit;cursor:pointer;padding:6px}
/* вход и синхронизация */
.acc-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;font-size:14px;color:var(--muted)}
.acc-card .btn{width:100%;padding:12px}
.acc-line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.acc-line span{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-line .ic{width:15px;height:15px;color:var(--accent)}
.acc-line i{font-style:normal}
.acc-line button{background:none;border:0;color:var(--later);font:inherit;cursor:pointer;padding:6px 0 6px 6px;flex-shrink:0}
.lg-links{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.lg-links button{background:none;border:0;color:var(--later);font:500 14px Manrope,system-ui,sans-serif;cursor:pointer;padding:6px 0}
/* экран входа (пока не вошли) */
#gate{display:none}
body.gated #gate{display:block}
body.gated #main{display:none}
body.auth-pending #main,body.auth-pending #gate{visibility:hidden}
.gate-card{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 18px}
.gate-card h3{font-family:Unbounded,sans-serif;font-weight:500;font-size:19px;line-height:1.2}
.gate-card p{color:var(--muted);font-size:14px;margin-top:8px}
.lg-err{color:var(--bad)!important;margin-top:10px!important}
.lg-err:empty{display:none}
/* подсказка «Установить на экран» */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{font-family:Unbounded,sans-serif;font-weight:500;font-size:19px;line-height:1.2}
.sheet p{color:var(--muted);font-size:14px;margin-top:8px}
.sheet ol{margin:14px 0 0;padding-left:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.sheet li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:15px}
.sheet li::before{content:counter(s);flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--sel-bg);color:var(--accent);font:700 13px Manrope,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.sheet li .ic{color:var(--accent);vertical-align:-4px}
.sheet .seg{display:flex;gap:6px;margin-top:16px}
.sheet .seg .chip{flex:1;text-align:center;padding:8px 6px;font-size:13px}
.sheet .btns{margin-top:18px}
</style>
</head>
<body class="auth-pending">
<div class="wrap">
  <h1>Что <span>почитать</span></h1>

  <section id="gate"></section>

  <div id="main">
  <div class="tabs">
    <button class="tab on" data-tab="pick">Подобрать</button>
    <button class="tab" data-tab="list">Мой список<span class="cnt" id="laterCnt"></span></button>
  </div>

  <!-- ПОДОБРАТЬ -->
  <section id="pick">
    <div id="news"></div>

    <div class="label">Что ищем</div>
    <div class="chips" id="kinds">
      <button class="chip on" data-v="any">Всё равно</button>
      <button class="chip" data-v="fiction">История</button>
      <button class="chip" data-v="nonfiction">Полезное</button>
    </div>

    <div class="label">Как</div>
    <div class="chips" id="fmt">
      <button class="chip on" data-v="any">Неважно</button>
      <button class="chip" data-v="audio">Слушать</button>
      <button class="chip" data-v="read">Читать</button>
    </div>

    <div class="label">Настроение</div>
    <div class="chips" id="moods">
      <button class="chip on" data-v="захватывающий триллер, не оторваться с первых страниц">Захватывающий сюжет</button>
      <button class="chip" data-v="детектив или триллер с неожиданной развязкой">Неожиданная развязка</button>
      <button class="chip" data-v="искусственный интеллект, технологии, будущее — понятно и интересно">ИИ и технологии</button>
      <button class="chip" data-v="полезное про деньги, работу, привычки, мышление — с практической пользой">Прокачать себя</button>
      <button class="chip" data-v="психология: почему люди поступают так, как поступают">Психология</button>
      <button class="chip" data-v="реальные истории, расследования, биографии, читаются как триллер">Реальные истории</button>
      <button class="chip" data-v="короткое и лёгкое, чтобы быстро втянуться">Короткое</button>
    </div>

    <div class="label">Похоже на… <i>(необязательно)</i></div>
    <input id="similar" placeholder="Например: «Код да Винчи» или Дэн Браун" autocomplete="off">

    <div class="btns">
      <button class="btn main" id="go">Подобрать 3 варианта</button>
      <button class="btn ghost" id="surprise" title="Удиви меня: один неожиданный вариант" aria-label="Удиви меня"></button>
    </div>

    <div id="results"></div>
  </section>

  <!-- МОЙ СПИСОК -->
  <section id="list" class="hidden">
    <div id="account"></div>
    <div class="sec">
      <h2 id="addTitle">Быстро добавить</h2>
      <div class="add">
        <div class="quick">
          <input id="quick" placeholder="Например: посоветовали «Три товарища»" autocomplete="off">
        </div>
        <button class="btn ghost" id="addBtn">Добавить</button>
        <div class="note">Можно надиктовать: нажмите микрофон на клавиатуре телефона и скажите, что посоветовали или что начали читать.</div>
      </div>
    </div>
    <div id="lists"></div>

    <details class="sec fold" id="tasteBox">
      <summary><h2 id="tasteTitle">Мой вкус <small>это я учитываю всегда</small></h2></summary>
      <textarea id="profile" style="margin-top:10px" placeholder="Что любите, что не любите, что бросили и почему…"></textarea>
      <button class="btn ghost" id="saveProfile" style="margin-top:8px;width:100%">Сохранить</button>
    </details>
  </section>

  </div>

  <div class="foot"><button id="howInstall">Как установить на телефон</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="sheet"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
